# Runs `just check-ci` on every pull request and on every push to main. Fedora supplies the
# maintainer's text fonts, Noto Sans and Adwaita, so text measures as wide as in a local run.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    container: fedora:43
    timeout-minutes: 20
    steps:
      # Without git, checkout downloads a tarball instead of cloning. The last two lines are
      # Chromium's libraries.
      - name: Install system packages
        run: >
          dnf -y -q install git nodejs just unzip which
          google-noto-sans-vf-fonts google-noto-sans-mono-vf-fonts adwaita-sans-fonts adwaita-mono-fonts
          nss atk at-spi2-atk cups-libs libdrm libxkbcommon libXcomposite libXdamage
          libXrandr mesa-libgbm pango alsa-lib libXfixes

      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('bun.lock') }}

      - run: bunx playwright install chromium

      - run: just check-ci
        env:
          CI: "1"

      # Traces of the failing end-to-end tests, for review without a local run.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
